[project]
name = "jlab"
version = "0.1.0"
description = "Blackrock NEV file loader for JLab neuroscience experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scipy>=1.17.1",
    "matplotlib>=3.10.9",
    "jupyterlab>=4.5.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jlab*", "brpylib*"]
